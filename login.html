<!DOCTYPE html>
<html lang="en">
<head>     
<meta charset="UTF-8">     
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SportsHub | Login</title>

<link rel="stylesheet" href="login.css">
</head>
<body>
<div class="login-container">

    <div class="left-section">

        <h1>🏆 SportsHub</h1>

        <div class="welcome-content">

            <h2>Every Game Has A Story.</h2>

            <p>
                Your complete platform for managing
                local sports tournaments, players,
                teams and live scores.
            </p>

            <h3>PLAY. COMPETE. WIN.</h3>

        </div>

    </div>


    <div class="right-section">

        <div class="login-box">

            <h2>Welcome Back!</h2>

            <p class="subtitle">
                Login to your SportsHub account
            </p>

            <form id="loginForm">

                <label>Username</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    required
                >

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <div class="options">

                    <label class="remember">
                        <input type="checkbox" id="showPassword">
                        Show Password
                    </label>

                    <a href="#">Forgot Password?</a>

                </div>

                <button type="submit">
                    LOGIN
                </button>

                <p id="message"></p>

            </form>

            <div class="register-link">

                Don't have an account?
                <a href="register.html">Register Now</a>

            </div>

            <div class="footer">
                SportsHub © 2026
            </div>

        </div>

    </div>

</div>

<script src="login.js"></script>
</body> 
</html>
